# The publication hop, without the person — and without loosening one property
# of the airlock that person was standing in.
#
# WHAT STAYS EXACTLY AS IT WAS
# ----------------------------
# `agentic-org/scripts/publish-edition-branch.mjs` still runs on the host,
# outside every container, with a restricted deploy key the container never
# sees, a pinned GitHub host key, a refspec that can only ever be
# `edition/YYYY-MM-DD`, and an explicit refusal of `main`, `master`, `staging`,
# `gh-pages` and `HEAD` as whole refs or as any component. None of that moves.
# The container still cannot write `main`.
#
# WHAT THIS ADDS
# --------------
# The second half of the hop — the merge a person did by hand — runs here
# instead, in GitHub Actions, where the credential is GitHub's own short-lived
# GITHUB_TOKEN rather than anything the newsroom holds.
#
# FOUR LOCKS, EACH INDEPENDENT
# ----------------------------
#  1. TRIGGER. `push` on `edition/*` only. No workflow_dispatch, no schedule, no
#     pull_request trigger — there is no way to ask this workflow to run against
#     any other ref.
#  2. REF SHAPE. The trigger filter is re-asserted inside the job against
#     `^refs/heads/edition/\d{4}-\d{2}-\d{2}$`, because a glob is a convenience
#     and this is the check that means it.
#  3. CI. `agentic-org/scripts/ci-gate.mjs` reads the CI workflow's own run
#     against THIS EXACT head SHA and refuses anything but `success`. It never
#     re-runs the checks itself (a second opinion is not the gate), never uses
#     `--admin`, and never merges while a run is queued or in progress. It is
#     read TWICE — once before the pull request exists and once immediately
#     before the merge, with the head SHA re-asserted in between. The rule
#     lives in a unit-tested script, not in inline YAML.
#  4. CONTENT. The diff against `main` must touch nothing outside the published
#     content the `clank-newsroom-content` volume serves -- the edition
#     directory and the byline views derived from it. That is the whole of what
#     `publish-edition-branch.mjs` may commit, and none of it is an input to the
#     organization image (agentic-org/scripts/public-content.mjs), so merging an
#     edition never makes the hourly release job rebuild anything. An edition
#     branch carrying a workflow change, a script change, a Spawnfile change or
#     a website change is refused and left for a person -- automation that can
#     merge arbitrary code into `main` on a branch-name match is a worse hole
#     than the one it closes.
#
# `permissions` is the whole grant: no packages, no id-token, no deployments.
name: Merge edition

on:
  push:
    branches:
      - "edition/*"

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

# One merge at a time per branch, and never cancel a merge half-done.
concurrency:
  group: merge-edition-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  # Exactly what publish-edition-branch.mjs commits, and the same list as
  # PUBLIC_CONTENT_PATHS in agentic-org/scripts/public-content.mjs -- held equal
  # by publish-edition-branch.test.mjs. Nothing under agentic-org/ is admitted
  # any more: an edition no longer repins the runtime bundle descriptor.
  ALLOWED_PATHS: "content/editions/ content/bylines/"

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any ref that is not a dated edition branch
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REF" | grep -Eq '^refs/heads/edition/[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::$REF is not an edition/YYYY-MM-DD branch — refusing"
            exit 1
          fi
          echo "ref $REF accepted"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a branch that changes anything but the edition content
        env:
          BASE: ${{ env.BASE_BRANCH }}
          ALLOWED: ${{ env.ALLOWED_PATHS }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE"
          changed="$(git diff --name-only "origin/$BASE...HEAD")"
          if [ -z "$changed" ]; then
            echo "::error::branch is identical to $BASE — nothing to merge"
            exit 1
          fi
          echo "changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'
          bad=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            ok=0
            for prefix in $ALLOWED; do
              case "$file" in "$prefix"*) ok=1 ;; esac
            done
            if [ "$ok" -eq 0 ]; then echo "::error::$file is outside the edition content paths"; bad=1; fi
          done <<< "$changed"
          [ "$bad" -eq 0 ] || { echo "::error::refusing to auto-merge a branch that changes more than the edition"; exit 1; }
          echo "every changed path is edition content"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The gate. `agentic-org/scripts/ci-gate.mjs` reads the CI workflow's own
      # conclusion for THIS EXACT head SHA and for no other commit — a green run
      # on an older push must never let a newer, redder one through. The rule
      # lives in a script with unit tests rather than in inline YAML, because
      # "an action_required duplicate does not veto a green push run, but an
      # action_required push run does" is precisely the kind of clause that
      # rots silently when it is only written once, in a shell pipeline.
      - name: Wait for CI on this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node agentic-org/scripts/ci-gate.mjs --sha="${{ github.sha }}" --repo="${{ github.repository }}"
          echo "green=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ env.BASE_BRANCH }}
        run: |
          set -euo pipefail
          number="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create --head "$BRANCH" --base "$BASE" \
              --title "chore(edition): publish ${BRANCH#edition/}" \
              --body "Automated publication of the ${BRANCH#edition/} edition. Merged by \`merge-edition.yml\` only after CI concluded success on this exact commit and the diff was confined to edition content."
            number="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number')"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "pull request #$number"

      # Read it a second time, after the pull request exists and immediately
      # before merging. Two reads separated in time is what closes the race
      # between the gate above and the merge below — and the head SHA is
      # re-asserted, so a branch that moved while CI ran is refused rather than
      # merged on the strength of a run for a commit that is no longer the tip.
      - name: Merge, but only if it is still green and still the same commit
        id: merge
        if: steps.ci.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="$(gh pr view "$NUMBER" --json headRefOid --jq .headRefOid)"
          [ "$head" = "$SHA" ] || { echo "::error::the branch moved from $SHA to $head while CI ran — refusing"; exit 1; }
          node agentic-org/scripts/ci-gate.mjs --sha="$SHA" --repo="${{ github.repository }}" --timeout-seconds=300  # short, but not zero: the duplicate run the PR itself created may still be queued
          state="$(gh pr view "$NUMBER" --json mergeable --jq .mergeable)"
          [ "$state" != "CONFLICTING" ] || { echo "::error::pull request #$NUMBER conflicts with the base — refusing"; exit 1; }
          gh pr merge "$NUMBER" --merge --delete-branch=false
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "merged #$NUMBER ($SHA)"

      - name: Dispatch website deploy for the merged edition
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node agentic-org/scripts/dispatch-pages-deploy.mjs --repo="${{ github.repository }}" --merged-head-sha="$SHA"
