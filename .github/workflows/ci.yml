# Runs on every branch so agent PRs cannot merge with broken content.
name: CI
on:
  push:
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Validate content
        run: node ops/validate-content.mjs
      - name: Install website deps
        working-directory: website
        run: npm ci
      # ops/lay-page.mjs assembles both page documents before compose_edition
      # sees them, so its guarantees are the ones that keep a composition from
      # being refused inside a wake. Run here rather than nowhere.
      - name: Test the page assembler
        run: npm run ops:test
      # content/topics.txt is a generated, committed view of content/topics.json:
      # the agents read the flat file instead of pulling the 503-line registry
      # into an expensive context. Regenerate and diff so an edit to topics.json
      # cannot silently leave the file the reporters actually read stale.
      - name: Check generated topic index is current
        run: |
          node agentic-org/scripts/build-topics-txt.mjs
          git diff --exit-code -- content/topics.txt
      # content/bylines/<agent>.tsv is the same idea for recall: 362 rows / 50 KB
      # standing in for 2.7 MB of edition JSON. It is derived from
      # content/editions/**, so filing an article must not leave it behind.
      - name: Check generated byline indexes are current
        run: |
          node agentic-org/scripts/build-bylines-tsv.mjs
          git diff --exit-code -- content/bylines
      # Nothing here ever built the organization, so nothing here ever saw the
      # briefs grow. `# The floor` — a preamble every brief carried verbatim —
      # crossed Daimon's 16,384-byte instruction ceiling across eight merges and
      # the first thing that noticed was a deploy; the same window merged an
      # unescaped `"` in brass's schedule prompt that made its manifest
      # unparseable. A real `spawnfile compile` is out of reach here (it needs a
      # pinned Daimon runtime image whose capability receipt attests the
      # compiler's contract manifest, i.e. Docker and a registry), but
      # `spawnfile validate` is not: it parses every manifest, resolves the
      # shared MCP servers and runs Daimon's compile preflight (instruction
      # size, attention, turn limits, MCP allowlists, opt-in servers, bundle
      # recipes and volume feeds) with no image and no private checkout. Built
      # from noopolis/spawnfile main, which this tree's declarations track; npm's
      # `spawnfile` predates them.
      - name: Spawnfile validate
        env:
          SPAWNFILE_REF: main
        run: |
          git init -q "$RUNNER_TEMP/spawnfile"
          git -C "$RUNNER_TEMP/spawnfile" fetch -q --depth 1 https://github.com/noopolis/spawnfile.git "$SPAWNFILE_REF"
          git -C "$RUNNER_TEMP/spawnfile" checkout -q FETCH_HEAD
          (cd "$RUNNER_TEMP/spawnfile" && npm ci --no-audit --no-fund && npm run build)
          node "$RUNNER_TEMP/spawnfile/dist/cli/index.js" validate agentic-org
      # The org budget is stricter than Spawnfile's limit: it reserves the bytes
      # Daimon appends after the compiled instructions.
      - name: Check every agent fits Daimon's instruction budget
        run: |
          node agentic-org/scripts/check-instruction-budget.mjs
          node --test agentic-org/scripts/check-instruction-budget.test.mjs
      - name: Check declared agent tools and release clock
        run: |
          node agentic-org/scripts/validate-org.mjs
          node --test agentic-org/scripts/engine-policy.test.mjs agentic-org/scripts/moltnet-pairings.test.ts agentic-org/scripts/tool-bundle-contract.test.mjs agentic-org/scripts/release-time.test.mjs agentic-org/scripts/signal-disposition.test.mjs agentic-org/scripts/production-newsroom-contracts.test.mjs
      # The research corpus and the published editions are Spawnfile fed
      # volumes: their validate hooks (corpus-contract.mjs, content-validate.mjs)
      # and the read-time gates over the landed layout need neither the private
      # checkout nor the state adapter, so they belong in the public gate.
      - name: Check the research corpus and published-content guards
        run: node --test agentic-org/scripts/content-validate.test.mjs agentic-org/scripts/public-content.test.mjs agentic-org/scripts/corpus-contract.test.mjs agentic-org/scripts/worlddesk-filing.test.mjs
      # EVERYTHING ELSE under agentic-org/scripts, because CI's coverage was an
      # explicit allowlist that had fallen eighteen files behind -- including
      # organization.test.mjs, which is the one check that the Spawnfiles and
      # the tree agree. Sixteen of those eighteen ran green with no
      # private checkout and no state adapter; the allowlist was not protecting CI
      # from them, it had just stopped being updated. ci-coverage.test.mjs now
      # fails when a test file exists that no step here names, so this cannot fall
      # behind again silently.
      - name: Check everything the allowlist had stopped covering
        run: node --test agentic-org/scripts/ci-coverage.test.mjs agentic-org/scripts/browser-broker-import.test.mjs agentic-org/scripts/build-bylines-tsv.test.mjs agentic-org/scripts/build-topics-txt.test.mjs agentic-org/scripts/compile-local.test.mjs agentic-org/scripts/cycle-audit.test.mjs agentic-org/scripts/dispatch-pages-deploy.test.mjs agentic-org/scripts/edition-index.test.mjs agentic-org/scripts/lifecycle-graph.test.mjs agentic-org/scripts/newsroom-mcp.test.mjs agentic-org/scripts/newsroom.test.mjs agentic-org/scripts/organization.test.mjs agentic-org/scripts/production-newsroom.test.mjs agentic-org/scripts/merge-bundle.test.mjs agentic-org/scripts/production-newsroom-article-format.test.mjs agentic-org/scripts/publication-policy.test.mjs agentic-org/scripts/release-handoff.test.mjs
      - name: Check unattended publication recovery guards
        run: node --test ops/prose-leaks.test.mjs ops/prose-lint.test.mjs agentic-org/scripts/freshness.test.mjs agentic-org/scripts/revision-facts.test.mjs agentic-org/scripts/alarm.test.mjs agentic-org/scripts/alarm-to-moltnet.test.mjs agentic-org/scripts/ci-gate.test.mjs agentic-org/scripts/systemd-contract.test.mjs agentic-org/scripts/wake-window.test.mjs agentic-org/scripts/quiescence-activity.test.mjs agentic-org/scripts/seam-run.test.mjs agentic-org/scripts/compose-gate.test.mjs agentic-org/scripts/composition-readiness.test.mjs agentic-org/scripts/staged-edition.test.mjs agentic-org/scripts/publish-edition-branch.test.mjs agentic-org/scripts/review-handoff.test.mjs agentic-org/scripts/production-newsroom-prose-review.test.mjs agentic-org/scripts/agent-rooms.test.mjs agentic-org/scripts/refusal-log.test.mjs agentic-org/scripts/ledger-research.test.mjs
      # The page data layer has one build-time decision in it that a green
      # astro build cannot see: whether a story advertises an og:image for a
      # card that was never rendered. Fifteen editions have no cards at all, and
      # every one of their stories used to serve a 404 image to every crawler.
      - name: Test the website data layer
        working-directory: website
        run: npm run test:lib
      - name: Test generated art rendering
        run: node ops/generated-art-rendering.integration.test.mjs
      - name: Build website
        working-directory: website
        run: npx astro build
      # A green build says nothing about whether the glyphcss scenes RENDER:
      # feeding the camera pre-0.1 units type-checks, builds, and draws the
      # whole globe into one character cell. This rasterizes it headlessly and
      # fails if the disc is a dot. (Needs Node 22.18+ for the .ts import.)
      - name: Verify glyphcss cameras render
        working-directory: website
        run: node scripts/verify-glyph-cameras.mjs
