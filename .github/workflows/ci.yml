# Runs on every branch so agent PRs cannot merge with broken content.
name: CI
on:
  push:
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Validate content
        run: node ops/validate-content.mjs
      # ops/lay-page.mjs assembles both page documents before compose_edition
      # sees them, so its guarantees are the ones that keep a composition from
      # being refused inside a wake. Run here rather than nowhere.
      - name: Test the page assembler
        run: npm run ops:test
      # content/topics.txt is a generated, committed view of content/topics.json:
      # the agents read the flat file instead of pulling the 503-line registry
      # into an expensive context. Regenerate and diff so an edit to topics.json
      # cannot silently leave the file the reporters actually read stale.
      - name: Check generated topic index is current
        run: |
          node agentic-org/scripts/build-topics-txt.mjs
          git diff --exit-code -- content/topics.txt
      # content/bylines/<agent>.tsv is the same idea for recall: 362 rows / 50 KB
      # standing in for 2.7 MB of edition JSON. It is derived from
      # content/editions/**, so filing an article must not leave it behind.
      - name: Check generated byline indexes are current
        run: |
          node agentic-org/scripts/build-bylines-tsv.mjs
          git diff --exit-code -- content/bylines
      # newsroom-runtime-bundle.json pins the tar every agent mounts at
      # ./repos/newsroom. It is written by a build nobody is obliged to run, so
      # it has now drifted three times — most recently past a module the MCP
      # entrypoint imports at load, which would have thrown in all twelve
      # containers at startup. The source archive is a pure function of the
      # tracked tree, so it is checkable here without the private checkout or
      # node_modules the rest of the build needs.
      - name: Check the runtime bundle descriptor describes this tree
        run: node agentic-org/scripts/check-bundle-descriptor.mjs
      # Nothing here ever built the organization, so nothing here ever saw the
      # briefs grow. `# The floor` — a preamble every brief carried verbatim —
      # crossed Daimon's 16,384-byte instruction ceiling across eight merges and
      # the first thing that noticed was a deploy; the same window merged an
      # unescaped `"` in brass's schedule prompt that made its manifest
      # unparseable. A real `spawnfile compile` is out of reach here (it needs a
      # pinned Daimon runtime image whose capability receipt attests the
      # compiler's contract manifest, i.e. Docker and a registry), but the
      # instruction budget and the manifests are pure functions of this tree.
      - name: Check every agent fits Daimon's instruction budget
        run: |
          node agentic-org/scripts/check-instruction-budget.mjs
          node --test agentic-org/scripts/check-instruction-budget.test.mjs
      - name: Check declared agent tools and release clock
        run: |
          node agentic-org/scripts/validate-org.mjs
          node --test agentic-org/scripts/tool-bundle-contract.test.mjs agentic-org/scripts/release-time.test.mjs
      - name: Install website deps
        working-directory: website
        run: npm ci
      # The page data layer has one build-time decision in it that a green
      # astro build cannot see: whether a story advertises an og:image for a
      # card that was never rendered. Fifteen editions have no cards at all, and
      # every one of their stories used to serve a 404 image to every crawler.
      - name: Test the website data layer
        working-directory: website
        run: npm run test:lib
      - name: Test generated art rendering
        run: node ops/generated-art-rendering.integration.test.mjs
      - name: Build website
        working-directory: website
        run: npx astro build
      # A green build says nothing about whether the glyphcss scenes RENDER:
      # feeding the camera pre-0.1 units type-checks, builds, and draws the
      # whole globe into one character cell. This rasterizes it headlessly and
      # fails if the disc is a dot. (Needs Node 22.18+ for the .ts import.)
      - name: Verify glyphcss cameras render
        working-directory: website
        run: node scripts/verify-glyph-cameras.mjs
