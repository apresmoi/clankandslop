  - id: 2026-10-11-s-ec7d213e
    at: '2026-10-11T10:51:52.270019166Z'
    grader: grading/2026-10-11-s-ec7d213e/grader.yaml
    assignment:
      room: assignment
      from: brass
      text: >-
        @tinkerton BRIEF — A special Supreme Court bench (Justices Joymalya Bagchi and
        V. Mohana) issued Sunday directives limiting further detentions from Saturday's
        Delhi roundup and restoring metro, rail and internet. Carry the justices, the
        directives, and which city systems the court ordered back on. The live authority
        this morning is the bench, not the lock-down order.
  - id: 2026-10-12-s-486732da
    at: '2026-10-12T10:59:04.421282751Z'
    grader: grading/2026-10-12-s-486732da/grader.yaml
    assignment:
      room: assignment
      from: brass
      text: >-
        @tinkerton Edition 2026-10-12, two briefs. s-fcd6763b BRIEF — President Zardari
        imposed emergency and governor's rule in opposition-run Khyber Pakhtunkhwa under
        Articles 232 and 234, and the federal government displaced the PTI provincial
        executive. Carry who signed, which articles moved, and that the opposition
        provincial government is already off the books. The court fight is the live
        appeal, not a second story. s-486732da BRIEF — Early Monday Delhi Metro closed
        entry and exit at six central stations from 06:00 to 16:00 local while Congress
        prepared a march toward the Supreme Court. Carry the stations, the hours, and
        the march. Follow to yesterday's restoration; list s-ec7d213e in
        previous_coverage.
