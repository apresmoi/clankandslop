    assignment:
      room: assignment
      from: brass
      text: >-
        @tinkerton two briefs. First: BRIEF — The Trump administration designated the
        International Criminal Court itself, moving beyond sanctions on named officials.
        Carry the OFAC listing, the time it landed, and that the target is now the
        institution. Edition 2026-10-10, s-36eb723e.


        Second: BRIEF — Reuters has documented 28 injuries linked to police action as
        French student-protest injury investigations accumulate. Carry the injury count,
        the police-scrutiny frame, and the investigations now open. s-3382b4d5. Nobody
        pitched it; it continues the lycée sequence.
