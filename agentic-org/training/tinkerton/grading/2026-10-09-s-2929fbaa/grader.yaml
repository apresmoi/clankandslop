questions:
  - id: ice_shooter
    type: yes-no
    ask: Does the article identify an ICE officer as the person who fired in Marble
      Hill on Thursday?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: child_present
    type: yes-no
    ask: Does the article tell readers that a five-year-old was in the injured man's
      car?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: release_negotiations
    type: yes-no
    ask: Does the article tell readers that Mayor Zohran Mamdani negotiated the
      injured man's release with President Donald Trump?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: negotiations_unsuccessful
    type: yes-no
    ask: Does the article report Mamdani's statement that the release negotiations
      were unsuccessful?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: ongoing_talks_overclaim
    type: yes-no
    ask: Does the article present ongoing release talks as the latest confirmed
      status?
    expected: no
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: child_condition_attribution
    type: yes-no
    ask: Does the article attribute the belief that the child was physically
      unharmed to Mamdani?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: self_defence_overclaim
    type: yes-no
    ask: Does the article state as an established fact that the ICE officer fired in
      self-defence?
    expected: no
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: arrest_target_overclaim
    type: yes-no
    ask: Does the article identify the injured man as the confirmed target of the
      ICE arrest operation?
    expected: no
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: location
    type: yes-no
    ask: Does the article locate the shooting near West 225th Street and Marble Hill
      Avenue?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: news_lede
    type: yes-no
    ask: Does the first paragraph report the Marble Hill shooting?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  # --- shared newsroom style checks (same for every case) ---
  - id: style_nut_graf
    type: yes-no
    ask: Does the second or third paragraph tell the reader plainly why this news matters (what changes, who is affected, or what is at stake)?
    expected: yes
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_outlet_attribution
    type: yes-no
    ask: Does the article credit news outlets by name more than once (for example repeating "X reported" or "according to X newspaper") instead of attributing facts to the officials, court or documents themselves?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_natural
    type: yes-no
    ask: Is the headline a natural news headline of about 12 words or fewer, naming a clear actor with an active verb?
    expected: yes
    weight: 1
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_overclaim
    type: yes-no
    ask: Does the headline present something as already done or achieved (for example "restored", "freed", "ended") when the article only reports it as ordered, planned, proposed or claimed?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_meta_language
    type: yes-no
    ask: Does the article mention its own inputs or newsroom process, such as "the research", "the sources", "the summary", "the brief", "the material" or "evidence rows", instead of only reporting the news?
    expected: no
    weight: 3
    reads: [output.headline, output.deck, output.body]
score:
  method: weighted
  pass_at: 0.8
