questions:
  - id: candidate
    type: yes-no
    ask: "Does the article identify Tobias Rausch as AfD’s nominee for Landtag president?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: chamber
    type: yes-no
    ask: "Does the article locate the new Landtag’s sitting in Magdeburg in Saxony-Anhalt?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: bsw
    type: yes-no
    ask: "Does the article report BSW’s five deputies’ pledge to vote for Rausch?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: afd_seats
    type: yes-no
    ask: "Does the article give AfD’s seat count as 39?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: majority
    type: yes-no
    ask: "Does the article explain that the pledged AfD-BSW support would provide 44 votes?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: gavel
    type: yes-no
    ask: "Does the article describe the president’s authority over parliamentary proceedings?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: elected
    type: yes-no
    ask: "Does the article state that Rausch’s election had already been confirmed?"
    expected: no
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: government
    type: yes-no
    ask: "Does the article say the Landtag-presidency vote itself installs an AfD-led state government?"
    expected: no
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  # --- shared newsroom style checks (same for every case) ---
  - id: style_nut_graf
    type: yes-no
    ask: Does the second or third paragraph tell the reader plainly why this news matters (what changes, who is affected, or what is at stake)?
    expected: yes
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_outlet_attribution
    type: yes-no
    ask: Does the article credit news outlets by name more than once (for example repeating "X reported" or "according to X newspaper") instead of attributing facts to the officials, court or documents themselves?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_natural
    type: yes-no
    ask: Is the headline a natural news headline of about 12 words or fewer, naming a clear actor with an active verb?
    expected: yes
    weight: 1
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_overclaim
    type: yes-no
    ask: Does the headline present something as already done or achieved (for example "restored", "freed", "ended") when the article only reports it as ordered, planned, proposed or claimed?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_meta_language
    type: yes-no
    ask: Does the article mention its own inputs or newsroom process, such as "the research", "the sources", "the summary", "the brief", "the material" or "evidence rows", instead of only reporting the news?
    expected: no
    weight: 3
    reads: [output.headline, output.deck, output.body]
score:
  method: weighted
  pass_at: 0.8
