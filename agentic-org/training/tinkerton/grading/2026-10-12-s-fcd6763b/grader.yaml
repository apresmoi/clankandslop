max_spend_usd: 0.5
questions:
  - id: presidential_action
    type: yes-no
    ask: Does the article identify President Asif Ali Zardari as the president who
      approved the Khyber Pakhtunkhwa intervention?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: emergency_article
    type: yes-no
    ask: Does the article identify Article 232 as a constitutional provision invoked
      for the emergency?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: governors_rule_article
    type: yes-no
    ask: Does the article identify Article 234 as a constitutional provision invoked
      for governor's rule?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: completed_displacement
    type: yes-no
    ask: Does the article tell readers that the PTI-led provincial executive had
      already been suspended?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: federal_rationale
    type: yes-no
    ask: Does the article attribute the counterterrorism-cooperation accusation
      against the provincial administration to federal officials?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: pti_counterposition
    type: yes-no
    ask: Does the article tell readers that PTI rejected the intervention as
      political suppression?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: court_challenge
    type: yes-no
    ask: Does the article report PTI's intention to challenge governor's rule
      through the courts?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: duration_overclaim
    type: yes-no
    ask: Does the article present six months as an undisputed initial legal term for
      governor's rule?
    expected: no
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: court_outcome_overclaim
    type: yes-no
    ask: Does the article say a court had already overturned the Khyber Pakhtunkhwa
      takeover?
    expected: no
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: news_lede
    type: yes-no
    ask: Does the first paragraph foreground the completed federal intervention in
      Khyber Pakhtunkhwa?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  # --- shared newsroom style checks (same for every case) ---
  - id: style_nut_graf
    type: yes-no
    ask: Does the second or third paragraph tell the reader plainly why this news matters (what changes, who is affected, or what is at stake)?
    expected: yes
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_outlet_attribution
    type: yes-no
    ask: Does the article credit news outlets by name more than once (for example repeating "X reported" or "according to X newspaper") instead of attributing facts to the officials, court or documents themselves?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_natural
    type: yes-no
    ask: Is the headline a natural news headline of about 12 words or fewer, naming a clear actor with an active verb?
    expected: yes
    weight: 1
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_overclaim
    type: yes-no
    ask: Does the headline present something as already done or achieved (for example "restored", "freed", "ended") when the article only reports it as ordered, planned, proposed or claimed?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_meta_language
    type: yes-no
    ask: Does the article mention its own inputs or newsroom process, such as "the research", "the sources", "the summary", "the brief", "the material" or "evidence rows", instead of only reporting the news?
    expected: no
    weight: 3
    reads: [output.headline, output.deck, output.body]
score:
  method: weighted
  pass_at: 0.8
