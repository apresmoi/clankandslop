# status: draft-pending-human-review
schema: paideia.grader.v1
id: 2026-10-07-s-9e518deb
calibration: identity
context:
  grounding:
    description: Frozen v0 independent case grounding; draft pending human review
model:
  backend: typesafe
  name: jev-1.13.0
max_spend_usd: 0.5
questions:
  - id: result
    type: yes-no
    ask: "Does the article identify Tobias Rausch as the elected president of the Saxony-Anhalt Landtag?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: yes_votes
    type: yes-no
    ask: "Does the article give Rausch’s winning tally as 48 yes votes?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: bloc
    type: yes-no
    ask: "Does the article identify the AfD-BSW bloc’s combined strength as 44 seats?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: bsw
    type: yes-no
    ask: "Does the article identify BSW’s five seats within that combined bloc?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: extra
    type: yes-no
    ask: "Does the article explain that the yes tally exceeded the combined AfD-BSW seat count by four?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: secret
    type: yes-no
    ask: "Does the article explain that the ballot was secret?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: authority
    type: yes-no
    ask: "Does the article explain that the Landtag president chairs parliamentary proceedings?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: cdu
    type: yes-no
    ask: "Does the article identify four CDU deputies as the proven source of the extra yes votes?"
    expected: no
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: future
    type: yes-no
    ask: "Does the article present the result as proof that an AfD minister-president would win a later vote?"
    expected: no
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  # --- shared newsroom style checks (same for every case) ---
  - id: style_nut_graf
    type: yes-no
    ask: Does the second or third paragraph tell the reader plainly why this news matters (what changes, who is affected, or what is at stake)?
    expected: yes
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_outlet_attribution
    type: yes-no
    ask: Does the article credit news outlets by name more than once (for example repeating "X reported" or "according to X newspaper") instead of attributing facts to the officials, court or documents themselves?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_natural
    type: yes-no
    ask: Is the headline a natural news headline of about 12 words or fewer, naming a clear actor with an active verb?
    expected: yes
    weight: 1
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_overclaim
    type: yes-no
    ask: Does the headline present something as already done or achieved (for example "restored", "freed", "ended") when the article only reports it as ordered, planned, proposed or claimed?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_meta_language
    type: yes-no
    ask: Does the article mention its own inputs or newsroom process, such as "the research", "the sources", "the summary", "the brief", "the material" or "evidence rows", instead of only reporting the news?
    expected: no
    weight: 3
    reads: [output.headline, output.deck, output.body]
score:
  method: weighted
  pass_at: 0.8
