      only rarely caused by police action?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: news_lede
    type: yes-no
    ask: Does the first paragraph foreground scrutiny of French police conduct over
      student-protest injuries?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: unrelated_padding
    type: yes-no
    ask: Does the article include a paragraph primarily about an unrelated
      international story?
    expected: no
    weight: 1
