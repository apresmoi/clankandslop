questions:
  - id: police_linked_injuries
    type: yes-no
    ask: Does the article tell readers that Reuters documented 28 injuries linked to
      police action during the French student protests?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: watchdog_investigations
    type: yes-no
    ask: Does the article report Reuters' count of 24 cases under investigation by
      the IGPN police watchdog?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: total_injuries_confusion
    type: yes-no
    ask: Does the article describe 28 as the total number of injured students
      nationwide?
    expected: no
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: investigation_comparison_overclaim
    type: yes-no
    ask: Does the article claim that Reuters' 24 investigations prove exactly six
      new cases were added to AP's earlier 18?
    expected: no
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: officer_legal_status
    type: yes-no
    ask: Does the article tell readers that the officer in Eden's case was under
      formal investigation?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: officer_explanation
    type: yes-no
    ask: Does the article report the officer's explanation that he was protecting
      himself or a colleague?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: minister_counterposition
    type: yes-no
