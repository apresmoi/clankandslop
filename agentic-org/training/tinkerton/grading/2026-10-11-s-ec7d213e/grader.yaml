questions:
  - id: bench_members
    type: yes-no
    ask: Does the article identify Joymalya Bagchi and V. Mohana as the justices on
      the special Supreme Court bench?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: lawful_detention
    type: yes-no
    ask: Does the article explain that the Supreme Court required detention to
      follow procedure established by law?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: metro_direction
    type: yes-no
    ask: Does the article tell readers that the Supreme Court directed normal Delhi
      Metro services?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: railway_direction
    type: yes-no
    ask: Does the article tell readers that the Supreme Court directed normal
      railway services?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: internet_direction
    type: yes-no
    ask: Does the article tell readers that the Supreme Court directed internet
      connectivity to remain undisturbed?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: public_order_qualification
    type: yes-no
    ask: Does the article explain that the transport directions allowed public-order
      restrictions justified under Article 19(2)?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: court_access
    type: yes-no
    ask: Does the article report the direction to remove the Section 163 restriction
      notice around the Supreme Court?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: compliance_overclaim
    type: yes-no
    ask: Does the article claim that full restoration of Delhi's transport and
      internet services had been verified?
    expected: no
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: blanket_release_overclaim
    type: yes-no
    ask: Does the article say the Supreme Court ordered unconditional release of all
      7,000 reported detainees?
    expected: no
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: news_lede
    type: yes-no
    ask: Does the first paragraph report Sunday's Supreme Court directions?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  # --- shared newsroom style checks (same for every case) ---
  - id: style_nut_graf
    type: yes-no
    ask: Does the second or third paragraph tell the reader plainly why this news matters (what changes, who is affected, or what is at stake)?
    expected: yes
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_outlet_attribution
    type: yes-no
    ask: Does the article credit news outlets by name more than once (for example repeating "X reported" or "according to X newspaper") instead of attributing facts to the officials, court or documents themselves?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_natural
    type: yes-no
    ask: Is the headline a natural news headline of about 12 words or fewer, naming a clear actor with an active verb?
    expected: yes
    weight: 1
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_overclaim
    type: yes-no
    ask: Does the headline present something as already done or achieved (for example "restored", "freed", "ended") when the article only reports it as ordered, planned, proposed or claimed?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_meta_language
    type: yes-no
    ask: Does the article mention its own inputs or newsroom process, such as "the research", "the sources", "the summary", "the brief", "the material" or "evidence rows", instead of only reporting the news?
    expected: no
    weight: 3
    reads: [output.headline, output.deck, output.body]
score:
  method: weighted
  pass_at: 0.8
