questions:
  - id: six_station_scope
    type: yes-no
    ask: Does the article tell readers that entry and exit were restricted at six
      central Delhi Metro stations on Monday?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: station_names
    type: yes-no
    ask: Does the article name Janpath, Mandi House, Barakhamba Road, Central
      Secretariat, Rajiv Chowk and Patel Chowk as the six affected stations?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: restriction_hours
    type: yes-no
    ask: Does the article give the announced restriction period as 06:00 to 16:00
      Indian local time?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: congress_march
    type: yes-no
    ask: Does the article tell readers that Congress planned a march towards the
      Supreme Court?
    expected: yes
    weight: 3
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: sunday_continuity
    type: yes-no
    ask: Does the article connect Monday's restrictions to Sunday's Supreme Court
      directions restoring normal Metro access?
    expected: yes
    weight: 2
    reads:
      - context.grounding
      - output.headline
      - output.deck
      - output.body
  - id: interchange_exception
    type: yes-no
