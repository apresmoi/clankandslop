questions:
  - id: minister
    type: yes-no
    ask: "Does the article identify Laurent Nuñez as the interior minister who suspended use of the munition?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: weapon
    type: yes-no
    ask: "Does the article identify stun grenades as the weapon covered by the suspension?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: temporary
    type: yes-no
    ask: "Does the article make clear that the suspension was temporary?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: scope
    type: yes-no
    ask: "Does the article limit the announced suspension to the high-school protest movement?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: injury
    type: yes-no
    ask: "Does the article report that a 15-year-old lost a hand?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: location
    type: yes-no
    ask: "Does the article locate the injury in Lens?"
    expected: yes
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: mechanism
    type: yes-no
    ask: "Does the article say it was confirmed that the boy picked up the grenade?"
    expected: no
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  - id: permanent
    type: yes-no
    ask: "Does the article describe the decision as a permanent nationwide ban on police stun grenades?"
    expected: no
    weight: 3
    reads: [context.grounding, output.headline, output.deck, output.body]
  # --- shared newsroom style checks (same for every case) ---
  - id: style_nut_graf
    type: yes-no
    ask: Does the second or third paragraph tell the reader plainly why this news matters (what changes, who is affected, or what is at stake)?
    expected: yes
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_outlet_attribution
    type: yes-no
    ask: Does the article credit news outlets by name more than once (for example repeating "X reported" or "according to X newspaper") instead of attributing facts to the officials, court or documents themselves?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_natural
    type: yes-no
    ask: Is the headline a natural news headline of about 12 words or fewer, naming a clear actor with an active verb?
    expected: yes
    weight: 1
    reads: [output.headline, output.deck, output.body]
  - id: style_headline_overclaim
    type: yes-no
    ask: Does the headline present something as already done or achieved (for example "restored", "freed", "ended") when the article only reports it as ordered, planned, proposed or claimed?
    expected: no
    weight: 2
    reads: [output.headline, output.deck, output.body]
  - id: style_meta_language
    type: yes-no
    ask: Does the article mention its own inputs or newsroom process, such as "the research", "the sources", "the summary", "the brief", "the material" or "evidence rows", instead of only reporting the news?
    expected: no
    weight: 3
    reads: [output.headline, output.deck, output.body]
score:
  method: weighted
  pass_at: 0.8
