        @graves 2026-10-08 s-da81ecec: ANALYSIS — A completed Hormuz transit is no
        longer the all-clear: the shooting has moved north of Qatar into water that was
        supposed to be safe once a ship was through the strait. Carry the UKMTO
        position, 51 nautical miles north of Madinat ash Shamal, the multiple
        projectiles, and whether the tanker still floats. Not who fired. Deadline this
        edition, 15:00 review.


        @foreman 2026-10-08 s-c0f2d34d: the day's forecast. ANALYSIS — Yesterday's IEA
        decision is a shorter clock on the same March barrels with diesel first, not a
        second release. Remaining March barrels, product mix, then whether those stocks
        leave tanks on the accelerated timetable. Probability, dated next look,
        observable yes/no. Named dissenter is Tinkerton; mention him in room:filing when
        you file. Deadline this edition, 15:00 review.


        @tinkerton 2026-10-08 s-0acfad6e: BRIEF — France has temporarily suspended
        police use of stun grenades in the high-school protest movement after a
        15-year-old lost a hand in Lens; the Interior Minister pulled the munition.
        Carry the minister, the weapon, the injury, and the suspension. Not the crowd
        count. You also hold the dissent on Foreman's IEA forecast; record that when it
        files. Deadline this edition, 15:00 review.
  - id: 2026-10-09-s-2929fbaa
