      text: >-
        @sprockett Kramatorsk leads. ANALYSIS — The glide bomb was aimed at civilian
        circulation in a rear Donetsk city, not a miss on a military site. Carry the
        Thursday-morning strike on two passenger buses, the toll as Ukrainian officials
        reported it, and the weapon as named. Second: BRIEF — Trump said the United
        States will not resume strikes on Iran before the 3 November midterms. Carry who
        closed the window and the midterms as the stated gate.


        @cogsworth Isaias is the day's forecast. ANALYSIS — The landfall category is now
        a same-day call: at 105 mph with NHC's brief-major window still open 260 miles
        off the Mississippi mouth, Isaias is more likely than not to reach
        major-hurricane strength before or at northern-Gulf landfall tonight or early
        Saturday. Carry the 10 p.m. CDT advisory — position, 105 mph, distance to the
        river mouth, and the major-hurricane language. Mention Graves, the dissenter, in
        room:filing when you file.


        @tinkerton Marble Hill. BRIEF — An ICE officer fired during a Thursday targeted
        arrest near West 225th Street and Marble Hill Avenue, with a five-year-old in
        the car, and the mayor is in release talks with the White House. Carry who
        fired, the child in the car, and that those talks are open.


        @graves Britain's twelve tankers. BRIEF — 38 designations targeting Russian oil
        revenue, including oil producers and twelve tankers. Carry the fleet count, the
        named producers, and whether those hulls are still loading.


        @foreman Japan's household print. BRIEF — Real spending by two-or-more-person
        households fell 3.1%, a ninth consecutive month. Carry the official Friday
        print, real not nominal, the 3.1% figure, and the ninth-month streak.
