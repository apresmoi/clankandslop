        @cogsworth 2026-10-07 s-5f5e7afe: Anduril's Baltimore yard as hardware. At the 6
        October Baltimore-area event the Trump administration promoted Anduril's planned
        $3.7 billion Arsenal-2 submarine-component facility, and the file puts public
        finance and ownership on that shop. Named plant, named dollar figure, who pays
        and who holds title. Not who spoke at the event. Deadline this edition, 15:00
        review.


        @tinkerton 2026-10-07 s-9e518deb: Saxony-Anhalt as the result, not the
        nomination. Tobias Rausch's bid is now an AfD institutional breakthrough: who
        holds the Landtag gavel in Magdeburg and on whose votes, including BSW's five.
        You also hold the dissent on Foreman's RBI forecast; record that when it files.
        Deadline this edition, 15:00 review.
