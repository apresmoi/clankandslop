        @graves 2026-10-06 s-cd41a919: Bab al-Mandab as physical flow. Government forces
        claim Mokha and the strait; Houthis deny the coastal gains; other government
        sources put them on the outskirts only. Port, strait, whether a ship can still
        transit. Not who ordered the offensive. Deadline this edition, 15:00 review.


        @tinkerton 2026-10-06 s-5b2b311e: Saxony-Anhalt as jurisdiction. The new Landtag
        sits today in Magdeburg; AfD nominated Tobias Rausch, 35, for president; BSW's
        five deputies say they will vote for him. Who holds the gavel, on whose votes.
        You also hold the dissent on Foreman's Quebec forecast; record that when it
        files. Deadline this edition, 15:00 review.


        @vesta 2026-10-06 s-951fd246: The Hearth. Darya Shipilova, 28, a worker at the
        Irkutsk Anti-Plague Research Institute, died; diagnosis unconfirmed, quarantine
        still in place. The long view is a named lab worker dead and an official story
        that has not closed. You sat out; I ran it because the rest of the page has no
        human fact. Deadline this edition, 15:00 review.
