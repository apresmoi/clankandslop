# A systemd drop-in for clank-cycle-audit.service, installed as
#
#   install -d -m 755 /etc/systemd/system/clank-cycle-audit.service.d
#   install -m 644 /root/work/clankandslop/agentic-org/ops/systemd/clank-cycle-audit-require-staged.conf \
#                  /etc/systemd/system/clank-cycle-audit.service.d/require-staged.conf
#   systemctl daemon-reload
#
# NOT part of the `install *.service *.timer` glob, and not installed by
# default, because it raises the bar the nightly audit holds the cycle to.
#
# The default is `--require=composed`: the day produced a paper. That is the
# right bar while the publication hop still ends in a person. Once
# clank-publish.timer is armed the hop is unattended end to end, and "composed
# but never staged" — pressman did not run, or `stage_release` refused — is a
# failure a person needs to hear about the same night, not discover the next
# morning from a site that did not change.
#
# Arm this in the SAME change that arms clank-publish.timer, and not before: a
# box where the publisher is disabled will never reach `staged`, so installing
# this early guarantees an alarm at 23:30 every single night.
[Service]
ExecStart=
ExecStart=/usr/bin/node /root/work/clankandslop/agentic-org/scripts/cycle-audit.mjs --require=staged
